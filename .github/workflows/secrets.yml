name: secrets

# A second pair of eyes for what must never be published: credentials, keys and
# personal data. Runs on every push and pull request, independently of the local
# hooks, so a `--no-verify` commit or a clone without hooks installed is still
# caught before (or as soon as) it reaches the default branch.
#
# The scan reports only a file, line and kind; it never prints the value.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test the scanner
        run: sh tools/check-sensitive-test.sh

      - name: Scan for secrets and personal data
        env:
          # Optional repository secret: personal strings for this maintainer,
          # one extended regex per line. Fork PRs do not receive it.
          PII_PATTERNS: ${{ secrets.PII_PATTERNS }}
        run: |
          set -eu
          if [ -n "${PII_PATTERNS:-}" ]; then
            printf '%s\n' "$PII_PATTERNS" > "$RUNNER_TEMP/pii-patterns"
            export SENSITIVE_PATTERNS_FILE="$RUNNER_TEMP/pii-patterns"
          fi

          # Scan only what this event publishes, plus the tree that will be live.
          range=
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              before="${{ github.event.before }}"
              after="${{ github.event.after }}"
              case "$before" in
                0000000000000000000000000000000000000000)
                  range="$after --not --remotes=origin"
                  ;;
                *)
                  range="$before..$after"
                  ;;
              esac
              ;;
          esac
          if [ -n "$range" ]; then
            sh tools/check-sensitive.sh --range "$range"
          fi
          sh tools/check-sensitive.sh --all

      - name: gitleaks over the full history
        run: |
          set -eu
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --verbose --exit-code 1
