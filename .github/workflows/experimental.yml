name: experimental

# Builds the EXPERIMENTAL Miyoo Mini Plus (miyoomini) pak and publishes it as a
# GitHub pre-release. Kept entirely separate from the stable Flip release
# workflow (release.yml): different branch (experimental), different tag pattern
# (exp-v*), and always marked --prerelease so it never shows as "Latest".
#
# The Mini Plus has no GPU, so this build does not draw to the screen yet — it
# probes the hardware and writes slot.log. See TESTERS.md.

on:
  push:
    tags: ['exp-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: miyoomini pak (experimental)
    runs-on: ubuntu-latest
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v7

      - name: Install cross tools
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list || true
          apt-get -o Acquire::Check-Valid-Until=false update
          # gcc-arm-linux-gnueabihf is the cross compiler; libc6-dev-armhf-cross
          # provides the target CRT objects (Scrt1.o, crti.o) and libc the linker
          # needs. Without the latter, linking fails with "cannot find Scrt1.o".
          apt-get install -y --no-install-recommends \
            zip gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Build the Mini Plus frontend (armhf, experimental)
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          set -eu
          cargo build --release -p slot --no-default-features --features miyoomini \
            --target armv7-unknown-linux-gnueabihf --target-dir target-mini

      - name: Assemble Slot.pak
        run: |
          set -eu
          pak="flip/Tools/miyoomini/Slot.pak"
          cp target-mini/armv7-unknown-linux-gnueabihf/release/slot "$pak/slot"
          chmod +x "$pak/slot" "$pak/launch.sh"
          # Must be 32-bit ARM for the Mini Plus (Cortex-A7), not aarch64.
          file "$pak/slot" | grep -q "ELF 32-bit.*ARM"
          test -x "$pak/launch.sh"

      - name: Package
        id: package
        run: |
          set -eu
          stage="$(mktemp -d)"
          cp -R flip/Tools/miyoomini/Slot.pak "$stage/Slot.pak"
          ( cd "$stage" && zip -qry "$GITHUB_WORKSPACE/Slot.pak-miyoomini.zip" Slot.pak )
          echo "zip=Slot.pak-miyoomini.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: pre-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Slot.pak-miyoomini.zip

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > notes.md <<'NOTES'
          **EXPERIMENTAL — Miyoo Mini Plus (`miyoomini`). Not working yet.**

          The Mini Plus has no GPU, so the graphics path is a work in progress.
          This build only probes the hardware and writes `slot.log`; it does
          **not** draw to the screen yet and ships without armhf cores. Do not
          expect it to play games.

          Testers wanted — see TESTERS.md. Please share the `slot.log` it
          produces on the GitHub thread or an issue.

          This is a pre-release and is **not** the stable Flip build. For the
          working Miyoo Flip release, see the latest `v*` release.

          A fork of slot by Brandon T. Kowalski (https://slot-cfw.fyi). Not
          affiliated with the upstream author or Nintendo.
          NOTES
          gh release create "$GITHUB_REF_NAME" Slot.pak-miyoomini.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "slot-flip $GITHUB_REF_NAME (Miyoo Mini Plus, experimental)" \
            --notes-file notes.md \
            --prerelease
