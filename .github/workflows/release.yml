name: release

# Builds the Miyoo Flip (my355) frontend for the tag and publishes a ready-to-use
# Slot.pak-my355.zip. The emulator cores in Slot.pak/System/ are committed, so CI
# only has to build the `slot` binary and package everything up.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: flip pak
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v7

      - name: Install zip
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list || true
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip

      - name: Build the Flip frontend (aarch64)
        run: |
          set -eu
          cargo build --release -p slot --no-default-features --features flip --target-dir target-flip

      - name: Assemble Slot.pak
        run: |
          set -eu
          pak="flip/Tools/my355/Slot.pak"
          cp target-flip/release/slot "$pak/slot"
          chmod +x "$pak/slot" "$pak/launch.sh"
          # Sanity-check the same things a user would trip over.
          file "$pak/slot" | grep -q aarch64
          file "$pak/System/mgba_libretro.so" | grep -q aarch64
          file "$pak/System/gpsp_libretro.so" | grep -q aarch64
          test -x "$pak/launch.sh"
          test -f "$pak/System/licenses/gpsp-GPL-2.0.txt"
          test -f "$pak/System/licenses/mgba-MPL-2.0.txt"
          test -f "$pak/System/licenses/gpsp-src.tar.gz"

      - name: Package
        id: package
        run: |
          set -eu
          stage="$(mktemp -d)"
          cp -R flip/Tools/my355/Slot.pak "$stage/Slot.pak"
          ( cd "$stage" && zip -qry "$GITHUB_WORKSPACE/Slot.pak-my355.zip" Slot.pak )
          echo "zip=Slot.pak-my355.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  build-miyoomini:
    name: miyoomini pak (experimental)
    runs-on: ubuntu-latest
    container: rust:1-bullseye
    steps:
      - uses: actions/checkout@v7

      - name: Install cross tools
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list || true
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip gcc-arm-linux-gnueabihf
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Build the Mini Plus frontend (armhf, experimental)
        env:
          CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
        run: |
          set -eu
          cargo build --release -p slot --no-default-features --features miyoomini \
            --target armv7-unknown-linux-gnueabihf --target-dir target-mini

      - name: Assemble Slot.pak
        run: |
          set -eu
          pak="flip/Tools/miyoomini/Slot.pak"
          cp target-mini/armv7-unknown-linux-gnueabihf/release/slot "$pak/slot"
          chmod +x "$pak/slot" "$pak/launch.sh"
          # Must be 32-bit ARM for the Mini Plus (Cortex-A7), not aarch64.
          file "$pak/slot" | grep -q "ELF 32-bit.*ARM"
          test -x "$pak/launch.sh"

      - name: Package
        id: package
        run: |
          set -eu
          stage="$(mktemp -d)"
          cp -R flip/Tools/miyoomini/Slot.pak "$stage/Slot.pak"
          ( cd "$stage" && zip -qry "$GITHUB_WORKSPACE/Slot.pak-miyoomini.zip" Slot.pak )
          echo "zip=Slot.pak-miyoomini.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.zip }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  publish:
    name: release
    needs: [build, build-miyoomini]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Slot.pak-my355.zip

      - uses: actions/download-artifact@v8
        with:
          name: Slot.pak-miyoomini.zip

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cat > notes.md <<'NOTES'
          Miyoo Flip (my355) build of slot. for MinUI.

          **Install:** unzip and copy the `Slot.pak` folder to
          `<SD CARD>/Tools/my355/Slot.pak`, then boot MinUI and open
          **Tools -> Slot**. Full guide in the README.

          Emulation by mGBA (MPL-2.0) and gpSP (GPL-2.0). Their licences,
          patches and gpSP's source are in `System/licenses/`.

          ---

          **`Slot.pak-miyoomini.zip` — EXPERIMENTAL, Miyoo Mini Plus, not
          working yet.** The Mini Plus has no GPU, so the graphics path is a
          work in progress; this build only probes the hardware and writes
          `slot.log`. It does **not** draw to the screen yet and ships without
          armhf cores. Testers wanted — see TESTERS.md. Do not expect it to
          play games.

          ---

          A fork of slot by Brandon T. Kowalski (https://slot-cfw.fyi). Not
          affiliated with the upstream author or Nintendo. Use your own
          legally-dumped ROMs.
          NOTES
          gh release create "$GITHUB_REF_NAME" Slot.pak-my355.zip Slot.pak-miyoomini.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "slot-flip $GITHUB_REF_NAME (Miyoo Flip)" \
            --notes-file notes.md
